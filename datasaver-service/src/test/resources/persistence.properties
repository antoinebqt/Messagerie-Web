# postgres DB # IN DOCKER COMPOSE SHOULD BE OVERRIDE BY ENV VARIABLES

# POSTGRES_USER
spring.datasource.username=${POSTGRESQL_ADDON_USER}
spring.datasource.password=${POSTGRESQL_ADDON_PASSWORD}
spring.datasource.url=jdbc:${POSTGRESQL_ADDON_URI}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
