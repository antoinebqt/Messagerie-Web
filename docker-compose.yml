version: "3"

services:
  message-publisher-service:
    container_name: message-publisher-service
    image: "polysnap/message-publisher-service"
    ports:
      - 3001:8080
    environment:
      - POSTGRESQL_ADDON_DB=${POSTGRESQL_ADDON_DB}
      - POSTGRESQL_ADDON_PASSWORD=${POSTGRESQL_ADDON_PASSWORD}
      - POSTGRESQL_ADDON_USER=${POSTGRESQL_ADDON_USER}
      - POSTGRESQL_ADDON_PORT=${POSTGRESQL_ADDON_PORT}
      - POSTGRESQL_ADDON_HOST=${POSTGRESQL_ADDON_HOST}
      - GOOGLE_APPLICATION_CREDENTIALS_JSON=${GOOGLE_APPLICATION_CREDENTIALS_JSON}
    depends_on:
      - postgres
      - cassandra

  message-retriever-service:
    container_name: message-retriever-service
    image: "polysnap/message-retriever-service"
    ports:
      - 3002:8080
    environment:
      - POSTGRESQL_ADDON_DB=${POSTGRESQL_ADDON_DB}
      - POSTGRESQL_ADDON_PASSWORD=${POSTGRESQL_ADDON_PASSWORD}
      - POSTGRESQL_ADDON_USER=${POSTGRESQL_ADDON_USER}
      - POSTGRESQL_ADDON_PORT=${POSTGRESQL_ADDON_PORT}
      - POSTGRESQL_ADDON_HOST=${POSTGRESQL_ADDON_HOST}
    depends_on:
      - postgres

  datasaver-service:
    container_name: datasaver-service
    image: "polysnap/datasaver-service"
    ports:
      - 3004:8080
    environment:
      - POSTGRESQL_ADDON_DB=${POSTGRESQL_ADDON_DB}
      - POSTGRESQL_ADDON_PASSWORD=${POSTGRESQL_ADDON_PASSWORD}
      - POSTGRESQL_ADDON_USER=${POSTGRESQL_ADDON_USER}
      - POSTGRESQL_ADDON_PORT=${POSTGRESQL_ADDON_PORT}
      - POSTGRESQL_ADDON_HOST=${POSTGRESQL_ADDON_HOST}
      - GOOGLE_APPLICATION_CREDENTIALS_JSON=${GOOGLE_APPLICATION_CREDENTIALS_JSON}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
    depends_on:
      - postgres

  postgres:
    image: postgres:14
    container_name: postgres-db
    environment:

      - POSTGRES_PASSWORD=${POSTGRESQL_ADDON_PASSWORD}
      - POSTGRES_USER=${POSTGRESQL_ADDON_USER}
      - POSTGRES_DB=${POSTGRESQL_ADDON_DB}
    ports:
      - 8001:5432

  cassandra:
    image: cassandra:latest
    ports:
      - 9042:9042